name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------
  # Ubuntu — Build (Docker-based, extract CLI binary)
  # -----------------------------------------------------------------
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cpu
          push: false
          load: true
          tags: dolphin-release:latest
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,scope=cpu,mode=max

      - name: Extract CLI binary
        run: |
          docker create --name temp dolphin-release:latest
          docker cp temp:/workspace/build/frontends/cli/dolphin_cli ./dolphin_cli
          docker rm temp
          chmod +x ./dolphin_cli
          tar czf dolphin-linux-x86_64.tar.gz dolphin_cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-linux-x86_64
          path: dolphin-linux-x86_64.tar.gz

  # -----------------------------------------------------------------
  # Ubuntu — Test (clean VM)
  # -----------------------------------------------------------------
  ubuntu-test:
    runs-on: ubuntu-22.04
    needs: ubuntu

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dolphin-linux-x86_64

      - name: Smoke test
        run: |
          tar xzf dolphin-linux-x86_64.tar.gz
          chmod +x ./dolphin_cli
          output=$(./dolphin_cli --help 2>&1) || {
            echo "::error::dolphin_cli exited with code $?"
            echo "$output"
            exit 1
          }
          echo "$output" | grep -qE "psfgenerator|deconvolution" || {
            echo "::error::Unexpected help output — CLI did not start correctly"
            echo "$output"
            exit 1
          }
          echo "Smoke test passed."

  # -----------------------------------------------------------------
  # Ubuntu — Publish to GitHub Release
  # -----------------------------------------------------------------
  ubuntu-publish:
    runs-on: ubuntu-22.04
    needs: ubuntu-test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dolphin-linux-x86_64

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dolphin-linux-x86_64.tar.gz

  # -----------------------------------------------------------------
  # Ubuntu CUDA — Build (Docker-based, extract CLI binary)
  # -----------------------------------------------------------------
  ubuntu-cuda:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: dolphin-release-cuda:latest
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,scope=cuda,mode=max

      - name: Extract CLI binary
        run: |
          docker create --name temp dolphin-release-cuda:latest
          docker cp temp:/workspace/build/frontends/cli/dolphin_cli ./dolphin_cli
          docker rm temp
          chmod +x ./dolphin_cli
          tar czf dolphin-linux-x86_64-cuda.tar.gz dolphin_cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-linux-x86_64-cuda
          path: dolphin-linux-x86_64-cuda.tar.gz

  # -----------------------------------------------------------------
  # Ubuntu CUDA — Test (clean VM)
  # -----------------------------------------------------------------
  ubuntu-cuda-test:
    runs-on: ubuntu-22.04
    needs: ubuntu-cuda

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dolphin-linux-x86_64-cuda

      - name: Smoke test
        run: |
          tar xzf dolphin-linux-x86_64-cuda.tar.gz
          chmod +x ./dolphin_cli
          output=$(./dolphin_cli --help 2>&1) || {
            echo "::error::dolphin_cli exited with code $?"
            echo "$output"
            exit 1
          }
          echo "$output" | grep -qE "psfgenerator|deconvolution" || {
            echo "::error::Unexpected help output — CLI did not start correctly"
            echo "$output"
            exit 1
          }
          echo "Smoke test passed."

  # -----------------------------------------------------------------
  # Ubuntu CUDA — Publish to GitHub Release
  # -----------------------------------------------------------------
  ubuntu-cuda-publish:
    runs-on: ubuntu-22.04
    needs: ubuntu-cuda-test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dolphin-linux-x86_64-cuda

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dolphin-linux-x86_64-cuda.tar.gz

  # -----------------------------------------------------------------
  # macOS — Build
  # -----------------------------------------------------------------
  macos:
    strategy:
      fail-fast: false
    runs-on: macos-14-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Homebrew cache
        id: brew-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-libtiff-fftw-libomp-ccache

      - name: Install dependencies via Homebrew
        run: |
          brew install libtiff fftw libomp ccache

      - name: Save Homebrew cache
        if: steps.brew-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ steps.brew-cache.outputs.cache-primary-key }}

      - name: Restore ITK cache
        id: cache-itk
        uses: actions/cache/restore@v4
        with:
          path: ~/itk-install
          key: itk-5.4.5-notiff-${{ runner.os }}-${{ runner.arch }}

      - name: Build ITK from source
        if: steps.cache-itk.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/InsightSoftwareConsortium/ITK/releases/download/v5.4.5/InsightToolkit-5.4.5.tar.gz
          tar -xzf InsightToolkit-5.4.5.tar.gz
          cd InsightToolkit-5.4.5
          mkdir ITK-build && cd ITK-build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$HOME/itk-install \
                -DBUILD_TESTING=OFF \
                -DBUILD_EXAMPLES=OFF \
                -DModule_ITKIOTIFF=OFF \
                ..
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Save ITK cache
        if: steps.cache-itk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/itk-install
          key: ${{ steps.cache-itk.outputs.cache-primary-key }}

      - name: Configure & Build library
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CLI=ON \
            -DBUILD_CUDA=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_BENCHMARKS=OFF \
            -DITK_DIR=$HOME/itk-install/lib/cmake/ITK-5.4 \
            -DOpenMP_ROOT=$(brew --prefix libomp) \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -- -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          cp build/frontends/cli/dolphin_cli ./dolphin_cli
          chmod +x ./dolphin_cli
          tar czf dolphin-macos-arm64.tar.gz dolphin_cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-macos-arm64
          path: dolphin-macos-arm64.tar.gz

  # -----------------------------------------------------------------
  # macOS — Test (clean VM, runtime deps only)
  # -----------------------------------------------------------------
  macos-test:
    strategy:
      fail-fast: false
    runs-on: macos-14-arm64
    needs: macos

    steps:
      - name: Install runtime dependencies
        run: brew install libtiff fftw libomp

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dolphin-macos-arm64

      - name: Smoke test
        run: |
          tar xzf dolphin-macos-arm64.tar.gz
          chmod +x ./dolphin_cli
          output=$(./dolphin_cli --help 2>&1) || {
            echo "::error::dolphin_cli exited with code $?"
            echo "$output"
            exit 1
          }
          echo "$output" | grep -qE "psfgenerator|deconvolution" || {
            echo "::error::Unexpected help output — CLI did not start correctly"
            echo "$output"
            exit 1
          }
          echo "Smoke test passed."

  # -----------------------------------------------------------------
  # macOS — Publish to GitHub Release
  # -----------------------------------------------------------------
  macos-publish:
    strategy:
      fail-fast: false
    runs-on: macos-14-arm64
    needs: macos-test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dolphin-macos-arm64

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dolphin-macos-arm64.tar.gz

  # -----------------------------------------------------------------
  # Windows — Build (MSVC + vcpkg)
  # -----------------------------------------------------------------
  windows:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore vcpkg binary cache
        id: vcpkg-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-windows-

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" |
          Out-Null

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Get CMake
        uses: lukka/get-cmake@v4.3.3

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DBUILD_CLI=ON `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}\vcpkg-overlay-ports" `
            -DBUILD_CUDA=OFF `
            -DENABLE_TESTS=OFF `
            -DENABLE_BENCHMARKS=OFF `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\installed"

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Build
        run: cmake --build build -j

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dolphin-windows | Out-Null
          Copy-Item build/frontends/cli/dolphin_cli.exe dolphin-windows/
          $vcpkgBin = "build/vcpkg_installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin\*.dll" dolphin-windows/
          }
          $vcRedist = "${env:VCToolsRedistDir}\x64\Microsoft.VC143.CRT"
          if (-not (Test-Path $vcRedist)) {
            throw "VCToolsRedistDir not found: $vcRedist"
          }
          Copy-Item "$vcRedist\*.dll" dolphin-windows/
          7z a dolphin-windows-x64.zip dolphin-windows/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-windows-x64
          path: dolphin-windows-x64.zip

  # -----------------------------------------------------------------
  # Windows — Test (clean VM, no build tools)
  # -----------------------------------------------------------------
  windows-test:
    runs-on: windows-2022
    needs: windows

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dolphin-windows-x64

      - name: Smoke test
        shell: pwsh
        run: |
          7z --% x dolphin-windows-x64.zip -o./test
          $exe = "./test/dolphin-windows/dolphin_cli.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "dolphin_cli.exe not found. Contents of ./test/dolphin-windows/:"
            Get-ChildItem ./test/dolphin-windows/ -ErrorAction SilentlyContinue | Format-Table Name, Length
            exit 1
          }
          $LASTEXITCODE = $null
          $output = (& $exe --help 2>&1) | Out-String
          $code = $LASTEXITCODE
          Write-Host "Exit code: $code"
          Write-Host "--- Output ---"
          Write-Host $output
          Write-Host "--- End output ---"
          if ($null -eq $code -or $code -ne 0) {
            Write-Error "dolphin_cli.exe exited with code $code"
            exit 1
          }
          if ($output -notmatch "psfgenerator|deconvolution") {
            Write-Error "Unexpected help output — CLI did not start correctly"
            exit 1
          }
          Write-Host "Smoke test passed."

  # -----------------------------------------------------------------
  # Windows — Publish to GitHub Release
  # -----------------------------------------------------------------
  windows-publish:
    runs-on: ubuntu-22.04
    needs: windows-test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dolphin-windows-x64

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dolphin-windows-x64.zip

  # -----------------------------------------------------------------
  # Windows CUDA — Build (MSVC + vcpkg + CUDA Toolkit)
  # -----------------------------------------------------------------
  windows-cuda:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          method: local
          cuda: '12.8.1'

      - name: Restore vcpkg binary cache
        id: vcpkg-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-windows-

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" |
          Out-Null

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Get CMake
        uses: lukka/get-cmake@v4.3.3

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DBUILD_CLI=ON `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}\vcpkg-overlay-ports" `
            -DBUILD_CUDA=ON `
            -DENABLE_TESTS=OFF `
            -DENABLE_BENCHMARKS=OFF `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\installed"

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Build
        run: cmake --build build -j

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dolphin-windows-cuda | Out-Null
          Copy-Item build/frontends/cli/dolphin_cli.exe dolphin-windows-cuda/
          $vcpkgBin = "build/vcpkg_installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin\*.dll" dolphin-windows-cuda/
          }
          $vcRedist = "${env:VCToolsRedistDir}\x64\Microsoft.VC143.CRT"
          if (-not (Test-Path $vcRedist)) {
            throw "VCToolsRedistDir not found: $vcRedist"
          }
          Copy-Item "$vcRedist\*.dll" dolphin-windows-cuda/
          7z a dolphin-windows-x64-cuda.zip dolphin-windows-cuda/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-windows-x64-cuda
          path: dolphin-windows-x64-cuda.zip

  # -----------------------------------------------------------------
  # Windows CUDA — Test (clean VM, no build tools)
  # -----------------------------------------------------------------
  windows-cuda-test:
    runs-on: windows-2022
    needs: windows-cuda

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dolphin-windows-x64-cuda

      - name: Smoke test
        shell: pwsh
        run: |
          7z --% x dolphin-windows-x64-cuda.zip -o./test
          $exe = "./test/dolphin-windows-cuda/dolphin_cli.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "dolphin_cli.exe not found. Contents of ./test/dolphin-windows-cuda/:"
            Get-ChildItem ./test/dolphin-windows-cuda/ -ErrorAction SilentlyContinue | Format-Table Name, Length
            exit 1
          }
          $LASTEXITCODE = $null
          $output = (& $exe --help 2>&1) | Out-String
          $code = $LASTEXITCODE
          Write-Host "Exit code: $code"
          Write-Host "--- Output ---"
          Write-Host $output
          Write-Host "--- End output ---"
          if ($null -eq $code -or $code -ne 0) {
            Write-Error "dolphin_cli.exe exited with code $code"
            exit 1
          }
          if ($output -notmatch "psfgenerator|deconvolution") {
            Write-Error "Unexpected help output — CLI did not start correctly"
            exit 1
          }
          Write-Host "Smoke test passed."

  # -----------------------------------------------------------------
  # Windows CUDA — Publish to GitHub Release
  # -----------------------------------------------------------------
  windows-cuda-publish:
    runs-on: ubuntu-22.04
    needs: windows-cuda-test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dolphin-windows-x64-cuda

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dolphin-windows-x64-cuda.zip
